<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - Gestao de Competencias</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--coal:#1c1c2e;--amber:#f5a623;--green:#27ae60;--red:#e74c3c;--smoke:#f0f2f5;--border:#dde2ea;--text:#2c3e50;--muted:#7f8c9a}
body{font-family:'Barlow',sans-serif;background:var(--smoke);color:var(--text);min-height:100vh}
#login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{background:#fff;border-radius:20px;padding:48px 40px;max-width:400px;width:100%;text-align:center;box-shadow:0 8px 40px rgba(0,0,0,.12);border-top:6px solid var(--amber)}
.login-logo{width:72px;height:72px;background:var(--coal);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:36px;margin:0 auto 20px}
.login-box h1{font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:800;color:var(--coal);margin-bottom:6px}
.login-box p{font-size:14px;color:var(--muted);margin-bottom:28px}
.login-input{width:100%;padding:13px 16px;border:2px solid var(--border);border-radius:10px;font-size:15px;margin-bottom:14px;font-family:'Barlow',sans-serif;outline:none;transition:border-color .2s}
.login-input:focus{border-color:var(--amber)}
.login-btn{width:100%;padding:14px;background:var(--coal);color:#fff;border:none;border-radius:10px;font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:800;cursor:pointer}
.login-error{color:var(--red);font-size:13px;margin-top:8px;display:none}
#dashboard-screen{display:none}
.site-header{background:var(--coal);box-shadow:0 2px 20px rgba(0,0,0,.3)}
.header-inner{max-width:1100px;margin:0 auto;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.header-left{display:flex;align-items:center;gap:14px}
.header-logo{width:44px;height:44px;background:var(--amber);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.header-title{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:800;color:#fff}
.header-sub{font-size:12px;color:#8899aa}
.btn-reload{padding:8px 16px;background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:8px;font-size:13px;cursor:pointer}
.main{max-width:1100px;margin:0 auto;padding:28px 16px 80px}
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:14px;margin-bottom:22px}
.stat-card{background:#fff;border-radius:12px;padding:16px 18px;box-shadow:0 2px 12px rgba(0,0,0,.07);border-left:4px solid var(--amber)}
.stat-val{font-family:'Barlow Condensed',sans-serif;font-size:30px;font-weight:800;color:var(--coal);line-height:1}
.stat-label{font-size:12px;color:var(--muted);margin-top:4px}
.filter-bar{background:#fff;border-radius:12px;padding:13px 18px;box-shadow:0 2px 12px rgba(0,0,0,.07);margin-bottom:18px;display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.filter-label{font-size:13px;font-weight:600;color:var(--text)}
.filter-input{padding:7px 10px;border:2px solid var(--border);border-radius:8px;font-size:13px;font-family:'Barlow',sans-serif;outline:none}
.filter-input:focus{border-color:var(--amber)}
.btn-filter{padding:7px 16px;background:var(--coal);color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer}
.btn-secondary{padding:7px 16px;background:#f0f2f5;color:var(--text);border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer}
.filter-tag{background:#e8f4fd;color:#0c447c;border-radius:20px;padding:3px 12px;font-size:12px;font-weight:600}
.tabs{display:flex;flex-wrap:wrap;border-bottom:2px solid var(--border);margin-bottom:20px}
.tab-btn{padding:10px 16px;font-size:13px;font-weight:600;color:var(--muted);background:none;border:none;border-bottom:3px solid transparent;margin-bottom:-2px;cursor:pointer;font-family:'Barlow',sans-serif;transition:all .2s;white-space:nowrap}
.tab-btn.active{color:var(--coal);border-bottom-color:var(--amber)}
.tab-content{display:none}.tab-content.active{display:block}
.gap-card{background:#fff;border-radius:12px;padding:22px;box-shadow:0 2px 12px rgba(0,0,0,.07)}
.gap-row{display:flex;align-items:center;gap:12px;margin-bottom:11px}
.gap-label{width:210px;font-size:13px;color:var(--text);flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gap-bar-wrap{flex:1;background:#f0f2f5;border-radius:8px;height:24px;overflow:hidden;position:relative}
.gap-bar-fill{height:100%;border-radius:8px;display:flex;align-items:center;padding-left:8px;transition:width .6s ease}
.gap-bar-fill span{font-size:11px;font-weight:700;color:#fff;white-space:nowrap}
.gap-val{width:36px;text-align:right;font-size:14px;font-weight:700;flex-shrink:0}
.matrix-wrap{overflow-x:auto}
.matrix-table{border-collapse:collapse;font-size:11px;min-width:900px;width:100%}
.matrix-table th{background:var(--coal);color:#fff;padding:9px 4px;text-align:center;font-size:10px;white-space:nowrap}
.matrix-table th.name-col{text-align:left;padding-left:12px;min-width:150px}
.matrix-table td{padding:8px 4px;border-bottom:1px solid #f0f2f5;text-align:center;font-size:12px}
.matrix-table td.name-cell{text-align:left;padding-left:12px;font-size:12px;font-weight:600;color:var(--coal)}
.matrix-table tr:nth-child(even) td{background:#fafafa}
.matrix-table tr.avg-row td{background:var(--amber)!important;color:var(--coal)!important;font-weight:800}
.sc{border-radius:5px;display:inline-block;min-width:30px;padding:2px 5px;font-weight:700;font-size:11px}
.s1{background:#fdf0ef;color:#c0392b}.s2{background:#fef4e8;color:#d35400}
.s3{background:#fefae6;color:#7d6608}.s4{background:#edfaf3;color:#1a5c38}.s5{background:#d5f5e3;color:#0e4d2a}
.evol-card{background:#fff;border-radius:12px;padding:20px;box-shadow:0 2px 12px rgba(0,0,0,.07);margin-bottom:14px}
.evol-name{font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:800;color:var(--coal);margin-bottom:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.evol-table{width:100%;border-collapse:collapse;font-size:10px}
.evol-table th{background:var(--coal);color:#fff;padding:6px 4px;text-align:center;font-size:9px}
.evol-table th.left{text-align:left;padding-left:8px}
.evol-table td{padding:5px 4px;border-bottom:1px solid #f0f2f5;text-align:center}
.evol-table td.left{text-align:left;padding-left:8px;font-weight:600;font-size:10px}
.dp{color:#27ae60;font-weight:700}.dn{color:#e74c3c;font-weight:700}.de{color:#aaa}
.ai-card{background:#fff;border-radius:12px;padding:22px;box-shadow:0 2px 12px rgba(0,0,0,.07)}
.ai-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px}
.ai-title{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:800;color:var(--coal)}
.btn-ai{padding:10px 22px;background:#534AB7;color:#fff;border:none;border-radius:10px;font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;cursor:pointer}
.ai-output{font-size:14px;line-height:1.7;color:var(--text);display:none}
.sug-card{background:#fff;border-radius:12px;padding:20px;box-shadow:0 2px 12px rgba(0,0,0,.07);margin-bottom:14px;border-left:4px solid #8e44ad}
.sug-nome{font-weight:700;font-size:14px;color:var(--coal);margin-bottom:4px;display:flex;align-items:center;gap:8px}
.sug-meta{font-size:11px;color:var(--muted);margin-bottom:10px}
.sug-texto{font-size:14px;color:var(--text);line-height:1.7;background:#f8f5ff;border-radius:8px;padding:12px 14px;border-left:3px solid #8e44ad}
#loading{display:none;text-align:center;padding:60px 20px;color:var(--muted)}
.spinner{display:inline-block;width:36px;height:36px;border:4px solid var(--border);border-top-color:var(--amber);border-radius:50%;animation:spin .7s linear infinite;margin-bottom:16px}
@keyframes spin{to{transform:rotate(360deg)}}
#empty-state{display:none;text-align:center;padding:60px 20px;color:var(--muted)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:12px 24px;border-radius:10px;font-size:14px;font-weight:600;box-shadow:0 4px 20px rgba(0,0,0,.25);z-index:999;opacity:0;pointer-events:none;transition:opacity .3s}
.toast.show{opacity:1}.toast.error{background:var(--red);color:#fff}.toast.info{background:var(--coal);color:#fff}
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">&#128202;</div>
    <h1>Dashboard Gestor</h1>
    <p>Matriz de Habilidades - Mecanicos Industriais</p>
    <input class="login-input" type="password" id="senha" placeholder="Senha de acesso"
      autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="login-btn" onclick="doLogin()">Entrar</button>
    <div class="login-error" id="login-error">Senha incorreta.</div>
  </div>
</div>

<div id="dashboard-screen">
  <header class="site-header">
    <div class="header-inner">
      <div class="header-left">
        <div class="header-logo">&#128202;</div>
        <div>
          <div class="header-title">Dashboard de Competencias</div>
          <div class="header-sub">Usina Sucroalcooleira - Gestao de Treinamentos</div>
        </div>
      </div>
      <button class="btn-reload" onclick="loadData()">Atualizar</button>
    </div>
  </header>

  <div class="main">
    <div id="loading"><div class="spinner"></div><br>Carregando...</div>
    <div id="empty-state">
      <div style="font-size:48px;margin-bottom:16px">&#128203;</div>
      <div style="font-size:18px;font-weight:600;color:var(--coal);margin-bottom:8px">Nenhuma avaliacao ainda</div>
      <div style="font-size:14px">Compartilhe o formulario com os mecanicos para comecar.</div>
    </div>
    <div id="data-view" style="display:none">

      <div class="filter-bar">
        <span class="filter-label">Periodo:</span>
        <input class="filter-input" type="date" id="filtro-de">
        <span style="color:var(--muted);font-size:13px">ate</span>
        <input class="filter-input" type="date" id="filtro-ate">
        <button class="btn-filter" onclick="aplicarFiltro()">Filtrar</button>
        <button class="btn-secondary" onclick="limparFiltro()">Limpar</button>
        <span class="filter-tag" id="filter-tag" style="display:none"></span>
      </div>

      <div class="stats-row" id="stats-row"></div>

      <div class="tabs">
        <button class="tab-btn active" id="tbtn-gaps"      onclick="showTab('gaps')">Gaps</button>
        <button class="tab-btn"        id="tbtn-matriz"    onclick="showTab('matriz')">Matriz</button>
        <button class="tab-btn"        id="tbtn-evolucao"  onclick="showTab('evolucao')">Evolucao</button>
        <button class="tab-btn"        id="tbtn-ia"        onclick="showTab('ia')">Analise IA</button>
        <button class="tab-btn"        id="tbtn-sugestoes" onclick="showTab('sugestoes')">Sugestoes</button>
      </div>

      <div class="tab-content active" id="tab-gaps">
        <div class="gap-card" id="gap-chart"></div>
      </div>
      <div class="tab-content" id="tab-matriz">
        <div class="matrix-wrap"><table class="matrix-table" id="matrix-table"></table></div>
      </div>
      <div class="tab-content" id="tab-evolucao">
        <div id="evolucao-container"></div>
      </div>
      <div class="tab-content" id="tab-ia">
        <div class="ai-card">
          <div class="ai-header">
            <div class="ai-title">Plano de Treinamento - Claude</div>
            <button class="btn-ai" onclick="analyzeWithAI()">Analisar no Claude</button>
          </div>
          <div class="ai-output" id="ai-output"></div>
        </div>
      </div>
      <div class="tab-content" id="tab-sugestoes">
        <div id="sugestoes-container"></div>
      </div>

    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var SENHA_GESTOR = "clealco2025";
var NPOINT_URL   = "https://api.npoint.io/be93e9a35f6735d40446";

var SECTIONS = [
  {id:"rolamentos",         title:"Rolamentos",         size:6,  color:"#e67e22"},
  {id:"lubrificacao",       title:"Lubrificacao",        size:6,  color:"#16a085"},
  {id:"alinhamento",        title:"Alinhamento",         size:5,  color:"#2980b9"},
  {id:"soldagem",           title:"Soldagem",            size:3,  color:"#c0392b"},
  {id:"selagem",            title:"Selagem Bombas",      size:4,  color:"#1565c0"},
  {id:"metrologia",         title:"Metrologia",          size:6,  color:"#d35400"},
  {id:"seguranca",          title:"Seguranca",           size:5,  color:"#1a8a4a"},
  {id:"manutencao",         title:"Manutencao Ind",      size:6,  color:"#546e7a"},
  {id:"preditiva",          title:"Preditiva",           size:5,  color:"#6a1b9a"},
  {id:"redutores",          title:"Redutores",           size:5,  color:"#37474f"},
  {id:"bombas",             title:"Bombas Centr",        size:5,  color:"#0277bd"},
  {id:"turbinas",           title:"Turbinas Vapor",      size:5,  color:"#b71c1c"},
  {id:"centrifugas_levedo", title:"Centr Levedo",        size:5,  color:"#558b2f"},
  {id:"centrifugas_acucar", title:"Centr Acucar",        size:5,  color:"#f9a825"},
  {id:"transportadores",    title:"Transportadores",     size:5,  color:"#4e342e"},
  {id:"ventiladores",       title:"Ventiladores",        size:5,  color:"#00838f"}
];

var allData = [];
var filteredData = [];

function doLogin() {
  var s = document.getElementById("senha").value;
  if (s === SENHA_GESTOR) {
    document.getElementById("login-screen").style.display = "none";
    document.getElementById("dashboard-screen").style.display = "block";
    loadData();
  } else {
    document.getElementById("login-error").style.display = "block";
  }
}

function showTab(name) {
  var tabs = ["gaps","matriz","evolucao","ia","sugestoes"];
  for (var i = 0; i < tabs.length; i++) {
    var t = tabs[i];
    var tab = document.getElementById("tab-" + t);
    var btn = document.getElementById("tbtn-" + t);
    if (tab) tab.className = "tab-content" + (t === name ? " active" : "");
    if (btn) btn.className = "tab-btn" + (t === name ? " active" : "");
  }
}

function aplicarFiltro() {
  var de = document.getElementById("filtro-de").value;
  var ate = document.getElementById("filtro-ate").value;
  if (!de && !ate) { limparFiltro(); return; }
  var deDate  = de  ? new Date(de  + "T00:00:00") : null;
  var ateDate = ate ? new Date(ate + "T23:59:59") : null;
  filteredData = allData.filter(function(r) {
    var d = r.dataISO ? new Date(r.dataISO) : (r.data ? new Date(r.data) : null);
    if (!d) return true;
    if (deDate  && d < deDate)  return false;
    if (ateDate && d > ateDate) return false;
    return true;
  });
  var tag = document.getElementById("filter-tag");
  var p = [];
  if (de)  p.push("de "  + new Date(de  + "T12:00:00").toLocaleDateString("pt-BR"));
  if (ate) p.push("ate " + new Date(ate + "T12:00:00").toLocaleDateString("pt-BR"));
  tag.textContent = filteredData.length + " registros - " + p.join(" ");
  tag.style.display = "inline-block";
  renderDashboard(filteredData);
  renderEvolucao(allData);
  renderSugestoes(allData);
}

function limparFiltro() {
  document.getElementById("filtro-de").value = "";
  document.getElementById("filtro-ate").value = "";
  document.getElementById("filter-tag").style.display = "none";
  filteredData = allData.slice();
  renderDashboard(filteredData);
  renderEvolucao(allData);
  renderSugestoes(allData);
}

async function loadData() {
  document.getElementById("loading").style.display = "block";
  document.getElementById("data-view").style.display = "none";
  document.getElementById("empty-state").style.display = "none";
  try {
    var res = await fetch(NPOINT_URL + "?t=" + Date.now(), {headers:{"Cache-Control":"no-cache"}});
    var data = await res.json();
    allData = Array.isArray(data) ? data : [];
    document.getElementById("loading").style.display = "none";
    if (allData.length === 0) {
      document.getElementById("empty-state").style.display = "block";
    } else {
      filteredData = allData.slice();
      document.getElementById("data-view").style.display = "block";
      renderDashboard(filteredData);
      renderEvolucao(allData);
      renderSugestoes(allData);
    }
  } catch(e) {
    console.error(e);
    document.getElementById("loading").style.display = "none";
    showToast("Erro ao carregar dados.", "error");
  }
}

function secAvg(record, sec) {
  var vals = [];
  for (var i = 0; i < sec.size; i++) {
    var v = (record.respostas || {})[sec.id + "_" + i];
    if (v !== undefined) vals.push(Number(v));
  }
  return vals.length ? vals.reduce(function(a,b){return a+b;},0) / vals.length : null;
}

function overallAvg(record) {
  var vals = Object.values(record.respostas || {}).map(Number).filter(function(v){return !isNaN(v);});
  return vals.length ? vals.reduce(function(a,b){return a+b;},0) / vals.length : null;
}

function scClass(v) {
  if (v === null || v === undefined) return "";
  if (v < 2) return "s1"; if (v < 3) return "s2"; if (v < 4) return "s3";
  if (v < 4.5) return "s4"; return "s5";
}

function bColor(v) {
  if (!v) return "#ddd";
  if (v < 2) return "#e74c3c"; if (v < 3) return "#e67e22";
  if (v < 4) return "#f39c12"; if (v < 4.5) return "#27ae60"; return "#1a8a4a";
}

function renderDashboard(data) {
  var avgGeral = data.map(function(d){return overallAvg(d);}).filter(function(v){return v !== null;});
  var mediaEquipe = avgGeral.length
    ? (avgGeral.reduce(function(a,b){return a+b;},0)/avgGeral.length).toFixed(2) : "-";

  var secsOrd = SECTIONS.map(function(s) {
    var vals = data.map(function(d){return secAvg(d,s);}).filter(function(v){return v !== null;});
    return {title:s.title, avg: vals.length ? vals.reduce(function(a,b){return a+b;},0)/vals.length : null};
  }).filter(function(s){return s.avg !== null;}).sort(function(a,b){return a.avg - b.avg;});
  var minSec = secsOrd.length ? secsOrd[0] : null;

  document.getElementById("stats-row").innerHTML =
    '<div class="stat-card"><div class="stat-val">' + data.length + '</div><div class="stat-label">Mecanicos avaliados</div></div>' +
    '<div class="stat-card" style="border-color:#27ae60"><div class="stat-val" style="color:#27ae60">' + mediaEquipe + '</div><div class="stat-label">Media geral equipe</div></div>' +
    '<div class="stat-card" style="border-color:#e74c3c"><div class="stat-val" style="color:#e74c3c;font-size:16px;padding-top:4px">' + (minSec ? minSec.title : "-") + '</div><div class="stat-label">Maior gap</div></div>' +
    '<div class="stat-card" style="border-color:#2980b9"><div class="stat-val">' + SECTIONS.length + '</div><div class="stat-label">Categorias</div></div>';

  var sectionAvgs = SECTIONS.map(function(s) {
    var vals = data.map(function(d){return secAvg(d,s);}).filter(function(v){return v !== null;});
    return {title:s.title, color:s.color, avg: vals.length ? vals.reduce(function(a,b){return a+b;},0)/vals.length : null, resps:vals.length};
  }).sort(function(a,b){ return (a.avg === null ? -1 : a.avg) - (b.avg === null ? -1 : b.avg); });

  document.getElementById("gap-chart").innerHTML = sectionAvgs.map(function(s) {
    var pct = s.avg ? (s.avg/5)*100 : 0;
    var col = bColor(s.avg);
    var lbl = s.avg ? s.avg.toFixed(1) : "-";
    return '<div class="gap-row">' +
      '<div class="gap-label">' + s.title + ' <span style="font-size:10px;color:#bbb">(' + s.resps + ')</span></div>' +
      '<div class="gap-bar-wrap">' +
        '<div class="gap-bar-fill" style="width:' + pct + '%;background:' + col + '">' +
          (s.avg ? '<span>' + lbl + '</span>' : '') + '</div>' +
        (!s.avg ? '<span style="position:absolute;left:8px;top:50%;transform:translateY(-50%);font-size:11px;color:#bbb">Nao respondida</span>' : '') +
      '</div>' +
      '<div class="gap-val" style="color:' + col + '">' + lbl + '</div>' +
    '</div>';
  }).join("");

  var thead = '<thead><tr><th class="name-col">Mecanico</th>' +
    SECTIONS.map(function(s){return '<th title="' + s.title + '">' + s.title.substring(0,4) + '</th>';}).join("") +
    '<th style="background:#b8720f">Med</th></tr></thead>';

  var rows = data.map(function(d, i) {
    var ov   = overallAvg(d);
    var meta = d.dataCurta
      ? '<div style="font-size:9px;color:#aaa;font-weight:400">' + d.dataCurta + (d.semana ? ' - ' + d.semana : '') + '</div>' : '';
    return '<tr style="background:' + (i%2===0?"#fff":"#fafafa") + '">' +
      '<td class="name-cell">' + d.nome + meta + '</td>' +
      SECTIONS.map(function(s){
        var v = secAvg(d,s);
        return '<td><span class="sc ' + scClass(v) + '">' + (v !== null ? v.toFixed(1) : '-') + '</span></td>';
      }).join("") +
      '<td><span class="sc ' + scClass(ov) + '">' + (ov !== null ? ov.toFixed(1) : '-') + '</span></td>' +
    '</tr>';
  }).join("");

  var avgCols = SECTIONS.map(function(s) {
    var vals = data.map(function(d){return secAvg(d,s);}).filter(function(v){return v !== null;});
    var avg  = vals.length ? vals.reduce(function(a,b){return a+b;},0)/vals.length : null;
    return '<td><span class="sc ' + scClass(avg) + '">' + (avg ? avg.toFixed(1) : '-') + '</span></td>';
  }).join("");
  var avgGlobal = avgGeral.length
    ? (avgGeral.reduce(function(a,b){return a+b;},0)/avgGeral.length).toFixed(1) : "-";

  document.getElementById("matrix-table").innerHTML = thead +
    '<tbody>' + rows + '<tr class="avg-row"><td class="name-cell">MEDIA DA EQUIPE</td>' + avgCols +
    '<td>' + avgGlobal + '</td></tr></tbody>';
}

function renderEvolucao(data) {
  var container = document.getElementById("evolucao-container");
  if (!container) return;
  var porNome = {};
  data.forEach(function(r) {
    if (!porNome[r.nome]) porNome[r.nome] = [];
    porNome[r.nome].push(r);
  });
  var nomes = Object.keys(porNome).sort();
  if (!nomes.length) {
    container.innerHTML = '<div style="text-align:center;padding:40px;color:var(--muted)">Nenhum dado disponivel.</div>';
    return;
  }
  container.innerHTML = nomes.map(function(nome) {
    var regs = porNome[nome].sort(function(a,b){
      return new Date(a.dataISO || a.id) - new Date(b.dataISO || b.id);
    });
    var ov0 = overallAvg(regs[0]);
    var ovN = overallAvg(regs[regs.length-1]);
    var evol = (regs.length > 1 && ov0 !== null && ovN !== null) ? ovN - ov0 : null;
    var evolBadge = "";
    if (evol !== null) {
      var bg  = evol > 0.05 ? "#d5f5e3" : evol < -0.05 ? "#fad7d7" : "#f0f2f5";
      var fc  = evol > 0.05 ? "#0e4d2a" : evol < -0.05 ? "#791F1F" : "#7f8c9a";
      var sym = evol > 0.05 ? "+" : "";
      evolBadge = '<span style="background:' + bg + ';border-radius:20px;padding:4px 12px;font-size:12px;font-weight:700;color:' + fc + '">' +
        sym + Math.abs(evol).toFixed(2) + '</span>';
    }
    if (regs.length === 1) {
      var r0 = regs[0];
      var n0 = Object.keys(r0.respostas || {}).length;
      return '<div class="evol-card"><div class="evol-name">' + nome +
        ' <span style="font-size:13px;font-weight:400;color:var(--muted)">' +
        (r0.dataCurta || "") + ' - ' + (r0.semana || "-") + ' - Media: ' +
        (overallAvg(r0) ? overallAvg(r0).toFixed(2) : "-") + '</span></div>' +
        '<div style="font-size:13px;color:var(--muted)">' + n0 + '/81 perguntas respondidas</div></div>';
    }
    var thead = '<thead><tr><th class="left">Data</th><th class="left">Sem</th>' +
      SECTIONS.map(function(s){return '<th>' + s.title.substring(0,3) + '</th>';}).join("") +
      '<th>Geral</th><th>D</th></tr></thead>';
    var prevOv = null;
    var rowsHtml = regs.map(function(r, i) {
      var ov    = overallAvg(r);
      var delta = (prevOv !== null && ov !== null) ? ov - prevOv : null;
      var dHtml = "";
      if (delta !== null) {
        if      (delta > 0.05)  dHtml = '<span class="dp">+' + delta.toFixed(2) + '</span>';
        else if (delta < -0.05) dHtml = '<span class="dn">' + delta.toFixed(2) + '</span>';
        else                    dHtml = '<span class="de">~</span>';
      }
      prevOv = ov;
      var isLast = (i === regs.length - 1);
      var dataTxt = r.dataCurta || ((r.data || "").split(",")[0]) || "-";
      return '<tr style="' + (isLast ? 'font-weight:700;background:#fffbe6' : '') + '">' +
        '<td class="left">' + dataTxt + '</td>' +
        '<td class="left" style="color:var(--muted)">' + (r.semana || "-") + '</td>' +
        SECTIONS.map(function(s){
          var v = secAvg(r,s);
          return '<td><span class="sc ' + scClass(v) + '">' + (v !== null ? v.toFixed(1) : '-') + '</span></td>';
        }).join("") +
        '<td><span class="sc ' + scClass(ov) + '">' + (ov !== null ? ov.toFixed(2) : '-') + '</span></td>' +
        '<td>' + dHtml + '</td></tr>';
    }).join("");
    return '<div class="evol-card"><div class="evol-name">' + nome +
      ' <span style="font-size:13px;font-weight:400;color:var(--muted)">' + regs.length + ' avaliacoes</span> ' +
      evolBadge + '</div>' +
      '<div style="overflow-x:auto"><table class="evol-table"><thead>' + thead +
      '</thead><tbody>' + rowsHtml + '</tbody></table></div></div>';
  }).join("");
}

function renderSugestoes(data) {
  var container = document.getElementById("sugestoes-container");
  if (!container) return;
  var comSug = data.filter(function(r){ return r.sugestoes && r.sugestoes.trim() !== ""; });
  var btn = document.getElementById("tbtn-sugestoes");
  if (btn) btn.textContent = "Sugestoes" + (comSug.length > 0 ? " (" + comSug.length + ")" : "");
  if (comSug.length === 0) {
    container.innerHTML = '<div style="text-align:center;padding:40px;color:var(--muted)">' +
      '<div style="font-size:40px;margin-bottom:12px">&#128172;</div>' +
      '<div style="font-weight:600;color:var(--coal);margin-bottom:6px">Nenhuma sugestao registrada ainda</div>' +
      '<div>As sugestoes deixadas pelos mecanicos aparecerao aqui.</div></div>';
    return;
  }
  var ord = comSug.slice().sort(function(a,b){
    return new Date(b.dataISO || b.id) - new Date(a.dataISO || a.id);
  });
  container.innerHTML = ord.map(function(r) {
    var ov   = overallAvg(r);
    var parts = [];
    var dt = r.dataCurta || (r.data ? r.data.split(",")[0] : "");
    if (dt)      parts.push(dt);
    if (r.semana) parts.push(r.semana);
    if (r.cargo)  parts.push(r.cargo);
    if (r.setor)  parts.push(r.setor);
    var meta  = parts.join(" - ");
    var texto = (r.sugestoes || "")
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
      .replace(/\n/g,"<br>");
    var inicial = r.nome.charAt(0).toUpperCase();
    return '<div class="sug-card">' +
      '<div class="sug-nome">' +
        '<div style="width:30px;height:30px;border-radius:50%;background:var(--coal);color:var(--amber);' +
          'display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex-shrink:0">' +
          inicial + '</div>' +
        r.nome +
        (ov !== null ? '<span class="sc ' + scClass(ov) + '" style="margin-left:auto">' + ov.toFixed(1) + '</span>' : '') +
      '</div>' +
      '<div class="sug-meta">' + meta + '</div>' +
      '<div class="sug-texto">' + texto + '</div>' +
    '</div>';
  }).join("");
}

function analyzeWithAI() {
  if (!filteredData.length) { showToast("Sem dados para analisar.", "error"); return; }
  var sectionAvgs = SECTIONS.map(function(s) {
    var vals = filteredData.map(function(d){return secAvg(d,s);}).filter(function(v){return v !== null;});
    var avg  = vals.length ? (vals.reduce(function(a,b){return a+b;},0)/vals.length).toFixed(2) : "sem dados";
    return s.title + ": " + avg + "/5";
  }).join("\n");
  var mechSummary = filteredData.map(function(d) {
    var ov = overallAvg(d);
    var scores = SECTIONS.map(function(s){
      var v = secAvg(d,s);
      return s.title.substring(0,3) + ":" + (v ? v.toFixed(1) : "?");
    }).join(" ");
    return d.nome + " (" + (d.cargo||"Mec") + ", " + (d.setor||"?") + "): Media " + (ov ? ov.toFixed(2) : "?") + " | " + scores;
  }).join("\n");
  var prompt = "Voce e especialista em gestao de manutencao industrial e desenvolvimento de pessoas em usinas sucroalcooleiras.\n\n" +
    "Analise os dados de avaliacao tecnica de mecanicos (escala 1-5) - 16 categorias: rolamentos, lubrificacao, alinhamento, soldagem, selagem de bombas, metrologia, seguranca, manutencao industrial, manutencao preditiva (vibracoes/Teknikao), redutores, bombas centrifugas, turbinas a vapor, centrifugas de levedo, centrifugas de acucar, transportadores e ventiladores.\n\n" +
    "MEDIAS POR CATEGORIA:\n" + sectionAvgs + "\n\n" +
    "AVALIACAO INDIVIDUAL (" + filteredData.length + " mecanicos):\n" + mechSummary + "\n\n" +
    "Forneca de forma pratica:\n" +
    "1. DIAGNOSTICO GERAL - principais gaps no contexto sucroalcooleiro\n" +
    "2. TOP 3 PRIORIDADES DE TREINAMENTO - urgencia e impacto na safra\n" +
    "3. PLANO DE ACAO - tipo, carga horaria e formato para cada prioridade\n" +
    "4. DESTAQUES - multiplicadores internos e quem precisa de atencao especial\n" +
    "5. RECOMENDACAO SAFRA - acoes urgentes antes da proxima safra";
  var url = "https://claude.ai/new?q=" + encodeURIComponent(prompt);
  window.open(url, "_blank");
  var output = document.getElementById("ai-output");
  output.style.display = "block";
  output.innerHTML =
    '<div style="background:#edfaf3;border-left:4px solid #27ae60;padding:16px;font-size:14px;color:#145a32;margin-bottom:14px">' +
      '<strong>Prompt enviado para o Claude!</strong><br><br>' +
      'Uma nova aba foi aberta com o claude.ai e o prompt preenchido com os dados da equipe.<br>' +
      '<span style="font-size:13px;color:#1a5c38">Se a aba nao abriu, permita popups para este site.</span>' +
    '</div>' +
    '<div style="background:#f8f9fa;border-radius:8px;padding:14px">' +
      '<div style="font-size:12px;font-weight:700;color:#555;margin-bottom:8px">Copiar prompt manualmente:</div>' +
      '<textarea id="ptxt" style="width:100%;height:140px;font-size:11px;padding:8px;border-radius:6px;border:1px solid #ddd;resize:vertical;font-family:monospace" readonly>' +
        prompt.replace(/</g,"&lt;").replace(/>/g,"&gt;") +
      '</textarea>' +
      '<button onclick="var t=document.getElementById(\'ptxt\');t.select();document.execCommand(\'copy\');showToast(\'Copiado!\',\'info\')" ' +
        'style="margin-top:8px;padding:7px 16px;background:#1c1c2e;color:#fff;border:none;border-radius:7px;font-size:13px;font-weight:600;cursor:pointer">Copiar prompt</button>' +
    '</div>';
}

function showToast(msg, type) {
  type = type || "info";
  var t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "toast " + type + " show";
  setTimeout(function(){ t.className = "toast"; }, 3500);
}
</script>
